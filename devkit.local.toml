#:schema https://github.com/AbysmalBiscuit/devkit/releases/latest/download/devkit-config.json

[defaults]
# A slug carrying a slash (`feat/decoration-metrics`) nests exactly like the
# branch.
worktree_root = "../alacritree-worktrees"

# Branch type is chosen per change (feat/, fix/, perf/, docs/), so it belongs
# in the slug rather than in a fixed prefix.
branch_prefix = ""

# `issue setup` cuts every branch from this ref. A stacked branch is re-pointed
# at its real base afterwards, per AGENTS.local.md.
baseline_ref = "origin/master"

# PRs go to Arnaud's repo, whose default branch is master, not devkit's staging.
pr_base = "master"

# Names where a baseline worktree would go. Nothing here creates one.
baseline_dir = "../alacritree-baselines"

# Untracked instructions copied into each new worktree, so an agent working
# there reads the same rules as one working in the main checkout.
worktree_include = ["AGENTS.local.md", "CLAUDE.local.md"]


# `pr create` pushes `-u origin`, with the remote name spelled into devkit, so
# `origin` is the project repo here and the fork answers to `fork`. A stacked PR
# needs its head and its base in the repository it is opened against.
[github]
issues_repo = "alacritree/alacritree"
pr_repo = "alacritree/alacritree"

# Several agents share this checkout and its worktrees. `enforce_writes`
# refuses a write to any path the session has not claimed with `lockm acquire`;
# `enforce_commands` refuses a cargo verb `[tasks]` already wires up and names
# the task to run instead.
[harness]
enforce_writes = true
enforce_commands = true

# Only these explicit rules refuse a bare cargo verb; deriving one from a task
# that merely adds flags does not fire, with or without the task's `guard`.
# `args` anchors at the head of the typed arguments, so `cargo +nightly fmt`
# matches nothing here and the fmt task runs.
#
# `check` and `build` are left unguarded: `check` runs the same argv as its
# task, and a bare `build` only misses the `--locked` lockfile check.
[harness.commands.cargo-fmt]
programs = ["cargo"]
args = ["fmt"]
reason = "Stable rustfmt skips the nightly-only options in rustfmt.toml, including the `ignore` list that keeps it off the vendored crates, and reformats files your change never touched. Run `devkit run task fmt`."

[harness.commands.cargo-test]
programs = ["cargo"]
args = ["test"]
reason = "The suite is run with nextest in this checkout. Run `devkit run task test`."

[harness.commands.cargo-clippy]
programs = ["cargo"]
args = ["clippy"]
reason = "Without --no-deps clippy lints the vendored crates, which are #![deny(clippy::all)] and cannot be edited here. Run `devkit run task clippy`."

[hooks]
after_worktree_create = [
    [
        "alacritree",
        "project",
        "refresh",
        "--all",
    ],
    [
        "zoxide",
        "add",
        "{{ worktree }}",
    ],
    [
        "{{ herdr_session }}",
        "open",
        "--no-focus",
        "--path",
        "{{ worktree }}",
    ],
]

after_worktree_remove = [
    [
        "{{ herdr_session }}",
        "close",
        "--path",
        "{{ worktree }}",
    ],
]

after_end = [["alacritree", "project", "refresh", "."]]


[tracker]
kind = "github"

# `enforce_commands` refuses the cargo verbs these tasks wire up, so every verb
# needs a task. `default-members` keeps them off the vendored crates, and
# `--locked` on the CI gates fails an uncommitted `Cargo.lock` here, not in CI.

[tasks.fmt]
# Stable rustfmt skips the nightly-only options in `rustfmt.toml`, `ignore`
# among them. Nightly drifts against itself too, so stage only the files the
# change edited.
description = "Format alacritree and its crates with the nightly rustfmt its config requires"
run = ["cargo", "+nightly", "fmt"]

[tasks.check]
description = "Type-check alacritree and its crates"
run = ["cargo", "check"]

[tasks.test]
# nextest is installed here and is what the suite is run with. CI still says
# `cargo test`, because it runs on machines where nextest is absent.
description = "Run the alacritree and crates/ tests with nextest"
run = ["cargo", "nextest", "run", "--locked"]

[tasks.e2e]
description = "Run the opt-in herdr end-to-end suite against a throwaway server"
run = [
    "cargo",
    "nextest",
    "run",
    "-p",
    "alacritree",
    "--locked",
    "--test",
    "herdr_e2e",
    "--run-ignored",
    "ignored-only",
    "--test-threads",
    "1",
]

[tasks.build]
description = "Build alacritree and its crates"
run = ["cargo", "build", "--locked"]

[tasks.clippy]
# Mirrors CI's clippy step. The vendored crates are `#![deny(clippy::all)]`;
# `default-members` leaves them out and `--no-deps` keeps a newer toolchain's
# lints off them as path dependencies.
env = { ZCCACHE_PATH_REMAP = "off" }
description = "Lint every alacritree crate the way CI does"
run = [
    "cargo",
    "clippy",
    "--all-targets",
    "--locked",
    "--no-deps",
    "--",
    "-D",
    "clippy::disallowed_methods",
]

[templates]
# Each `Closes` line spells `issues_repo` out, so the body stays correct if
# issues and PRs ever live in different repositories again. The TL;DR heading
# renders empty, to be filled by hand.
pr_body = '''
{%- set ids = (((issue if issue is defined else "") ~ " " ~ closes) | split) -%}
{%- set agent = agent_model or agent_harness -%}
## TL;DR (human written)
{{ human_tldr }}
{%- if ids %}

---
{% for id in ids %}
Closes {{ issues_repo }}#{{ id }}
{%- endfor %}
{%- endif %}
{%- if agent %}

---

## Agent summary
{%- endif %}

{{ input | trim }}
{%- if agent %}

---

🤖 Generated with {{ agent_model }}{% if agent_model and agent_harness %} via {% endif %}{{ agent_harness }}
{%- endif %}
'''

[templates.variables]
# Hooks are spawned without a shell, so `~` stays literal and a bare name is
# resolved by appending `.exe` alone: the extensionless script is invisible to
# PATH and its `.cmd` shim is what answers. A machine that names the shim
# differently re-points this one line.
herdr_session = "herdr-session.cmd"

# The worktree's own issue is already in the render context as `issue`; this is
# for the extra ones a PR closes, whitespace separated: `--arg closes="12 41"`.
closes = ""

# Spelled out again here because the template context does not carry
# `[github] issues_repo`; keep the two in sync.
issues_repo = "alacritree/alacritree"

# devkit fills `agent_model` and `agent_harness` from the calling agent.
# Override per PR: `--arg agent_model="Claude Opus 5 (1M Context)"`.
