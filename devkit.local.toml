#:schema https://github.com/AbysmalBiscuit/devkit/releases/latest/download/devkit-config.json

[defaults]
# A slug carrying a slash (`feat/decoration-metrics`) nests exactly like the
# branch.
worktree_root = "../alacritree-worktrees"

# Branch type is chosen per change (feat/, fix/, perf/, docs/), so it belongs
# in the slug rather than in a fixed prefix.
branch_prefix = ""

# `issue setup` cuts every branch from this ref; a stacked branch is re-pointed
# at its real base afterwards. See "Working on features/bugfixes" in
# AGENTS.local.md.
baseline_ref = "origin/master"

# PRs go to Arnaud's repo, whose default branch is master, not devkit's staging.
pr_base = "master"

# Names where a baseline worktree would go. Nothing here creates one.
baseline_dir = "../alacritree-baselines"

# Untracked instructions copied into each new worktree, so an agent working
# there reads the same rules as one working in the main checkout.
worktree_include = ["AGENTS.local.md", "CLAUDE.local.md"]


[github]
issues_repo = "AbysmalBiscuit/alacritree"
pr_repo = "mathix420/alacritree"

# Several agents share this checkout and its worktrees. `enforce_writes`
# refuses a write to any path the session has not claimed with `lockm acquire`;
# `enforce_commands` refuses a cargo verb `[tasks]` already wires up and names
# the task to run instead.
[harness]
enforce_writes = true
enforce_commands = true

# Only these explicit rules refuse a bare cargo verb; deriving one from a task
# that merely adds flags does not fire, with or without the task's `guard`.
# `args` anchors at the head of the typed arguments, so `cargo +nightly fmt`
# matches nothing here and the fmt task runs.
#
# `check` and `build` are left unguarded: `check` runs the same argv as its
# task, and a bare `build` only misses the `--locked` lockfile check.
[harness.commands.cargo-fmt]
programs = ["cargo"]
args = ["fmt"]
reason = "Stable rustfmt ignores the nightly-only options in rustfmt.toml and reformats files your change never touched. Run `devkit run task fmt`."

[harness.commands.cargo-test]
programs = ["cargo"]
args = ["test"]
reason = "The suite is run with nextest in this checkout. Run `devkit run task test`."

[harness.commands.cargo-clippy]
programs = ["cargo"]
args = ["clippy"]
reason = "Without --no-deps clippy lints the vendored crates, which are #![deny(clippy::all)] and cannot be edited here. Run `devkit run task clippy`."

[hooks]
# Doppler scopes are keyed by absolute path, so a fresh worktree matches none and
# every `doppler run` that omits -p fails until someone runs setup by hand —
# `bun run dev` included. Setup at the worktree root reads the repo's doppler.yaml
# and writes a scope per mapped path. Idempotent.
after_worktree_create = [
    # The sidebar lists worktrees under the project they hang off, so the
    # refresh names the checkout rather than `.`, which is the worktree that
    # was just created and is not a project. The climb counts the slug's
    # segments because a slug carrying a slash nests that much deeper, and it
    # lands beside the checkout because `worktree_root` is its sibling.
    [
        "alacritree",
        "project",
        "refresh",
        "{{ '../' * ((slug | split('/') | length) + 1) }}alacritree",
    ],
    [
        "zoxide",
        "add",
        "{{ worktree }}",
    ],
    # `open` rather than `new`: a workspace comes with a shell tab already, and
    # `new` with no agent named falls back to an interactive picker, which a
    # hook running with no stdin cannot answer.
    [
        "{{ herdr_session }}",
        "open",
        "--path",
        "{{ worktree }}",
    ],
]

# Herdr keeps a workspace per checkout, and nothing prunes the one belonging to a
# worktree that is gone. Its shells stay put, so the kernel reports their cwd as
# `<path> (deleted)`, which is the only handle left once git has pruned the
# checkout: strip the marker and every pane at or under the path names the
# workspace to close. A dead Herdr prints nothing and closes nothing.
after_worktree_remove = [
    [
        "{{ herdr_session }}",
        "close",
        "--path",
        "{{ worktree }}",
    ],
]

after_end = [["alacritree", "project", "refresh", "."]]


[tracker]
kind = "github"

# `enforce_commands` refuses every cargo verb these tasks wire up, so a verb
# with no task here is a verb nobody can run. All of them are scoped to
# `-p alacritree`, since the vendored crates are read-only. `--locked` is on
# the three CI gates and off the fast loops, so an uncommitted `Cargo.lock`
# fails here rather than in CI.

[tasks.fmt]
# Ten of the fifteen options in `rustfmt.toml` are nightly-only, and stable
# rustfmt ignores every one of them after a warning, so a bare `cargo fmt`
# reformats files the change never touched. Nightly drifts against itself too,
# so even this rewrites code it has no business touching: stage the files the
# change edited, not everything `git status` lists afterwards.
description = "Format alacritree with the nightly rustfmt its config requires"
run = ["cargo", "+nightly", "fmt", "-p", "alacritree"]

[tasks.check]
description = "Type-check alacritree"
run = ["cargo", "check", "-p", "alacritree"]

[tasks.test]
# nextest is installed here and is what the suite is run with. CI still says
# `cargo test`, because it runs on machines where nextest is absent.
description = "Run the alacritree tests with nextest"
run = ["cargo", "nextest", "run", "-p", "alacritree", "--locked"]

[tasks.e2e]
description = "Run the opt-in herdr end-to-end suite against a throwaway server"
run = [
    "cargo",
    "nextest",
    "run",
    "-p",
    "alacritree",
    "--locked",
    "--test",
    "herdr_e2e",
    "--run-ignored",
    "ignored-only",
    "--test-threads",
    "1",
]

[tasks.build]
description = "Build alacritree"
run = ["cargo", "build", "-p", "alacritree", "--locked"]

[tasks.clippy]
# `--no-deps` keeps clippy off the vendored crates: they are
# `#![deny(clippy::all)]`, so a lint a newer toolchain adds becomes an error
# nothing here may fix. `-D clippy::disallowed_methods` is on the stacked
# branches but not yet on master, making this stricter than master's CI and
# aligned with where the fork is going.
env = { ZCCACHE_PATH_REMAP = "off" }
description = "Lint alacritree the way CI does"
run = [
    "cargo",
    "clippy",
    "-p",
    "alacritree",
    "--all-targets",
    "--locked",
    "--no-deps",
    "--",
    "-D",
    "clippy::disallowed_methods",
]

[templates]
# Every PR here has the same shape: a human TL;DR, the issues it closes, then a
# Claude-written section under a rule. The `Closes` lines have to sit inside the
# TL;DR rather than at the end, because GitHub only reads them from the body and
# a reader skimming the top should see what the PR resolves without scrolling
# past the summary.
#
# `{{ input }}` is `--pr-body`, so the Claude summary goes there. The template
# emits the TL;DR heading and nothing under it. That half is written into the
# open PR by hand, never rendered from an argument.
pr_body = '''
## TL;DR (human written)

{%- set ids = (((issue if issue is defined else "") ~ " " ~ closes) | split) -%}
{%- if ids %}
{% for id in ids %}
Closes {{ issues_repo }}#{{ id }}
{%- endfor %}
{%- endif %}

Claude summary below:

---
{% if stacked_on %}
> Stacked on #{{ stacked_on }}. The base is `master`, so the diff below also
> contains that PR's commits. Review #{{ stacked_on }} first.
{% endif %}
{{ input }}

---

Written by {{ model }} in Claude Code.
'''

[templates.variables]
# Hooks are spawned without a shell, so `~` stays literal and a bare name is
# resolved by appending `.exe` alone: the extensionless script is invisible to
# PATH and its `.cmd` shim is what answers. A machine that names the shim
# differently re-points this one line.
herdr_session = "herdr-session.cmd"

# The worktree's own issue is already in the render context as `issue`; this is
# for the extra ones a PR closes, whitespace separated: `--arg closes="12 41"`.
closes = ""

# PR number this branch is stacked on, which renders the review-order note.
# Empty for a branch that really does sit on master.
stacked_on = ""

# Issues live on the fork, PRs go to Arnaud's repo, so a bare `#41` in the body
# would resolve against the wrong one. Spelled out again here because the
# template context does not carry `[github] issues_repo`; keep the two in sync.
issues_repo = "AbysmalBiscuit/alacritree"

# Attribution line. Override per PR when a different model did the work:
# `--arg model="Claude Opus 5 (1M Context)"`.
model = "Claude Opus 5"
